name: Validar máscaras

on:
  push:
    paths:
      - "roteador-atual/**"
      - "app/src/components/rotrix2/**"
      - ".github/workflows/validar-mascaras.yml"
  pull_request:
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roteador-atual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Gerar o banco
        run: LAUDO_BASE=/tmp/base.sqlite LAUDO_CATALOGO=/tmp/catalogo.txt python construir_base.py
      - name: Validar todas as regiões
        run: |
          regioes=$(find dados/mascaras -name normal.txt -printf '%h\n' | sort)
          python validar_regiao.py $regioes
      - name: Auditar os gatilhos (nenhum pode abrir exame sem dizer o exame)
        run: LAUDO_BASE=/tmp/base.sqlite python auditar_gatilhos.py
      - name: Auditar frase quebrada (lacuna que deixou unidade ou parenteses para tras)
        run: LAUDO_BASE=/tmp/base.sqlite python auditar_frases.py
      - name: Conferir o prompt de sistema (REDATOR_ROTRIX.md monta todas as rotas)
        run: python prompts.py
      - name: Conferir que os rotulos do banco batem com os do renderizador
        run: python conferir_rotulos.py
      - name: Auditoria de custo (roda sem chave; falha se a tabela de preço quebrar)
        run: LAUDO_BASE=/tmp/base.sqlite python auditar_custo.py
      - name: Testar a rota de nuvem (sem internet, respostas simuladas)
        run: LAUDO_BASE=/tmp/base.sqlite python testar_nuvem.py
      - name: Sinonimos do dia a dia (termo leigo acha o achado, sem contradicao)
        run: LAUDO_BASE=/tmp/base.sqlite python testar_sinonimos.py
      - name: Desempenho do roteamento (teto de tempo; regressao de lentidao)
        run: LAUDO_BASE=/tmp/base.sqlite python testar_perf_roteador.py
      - name: "'bilateral' nao entra em frase de achado unico (laudo assinado 26/09)"
        run: LAUDO_BASE=/tmp/base.sqlite python testar_lado_bilateral.py
      - name: Testar a TECNICA das radiografias (as incidencias que ele ditou)
        run: LAUDO_BASE=/tmp/base.sqlite python testar_tecnica_rx.py
      - name: conferir_usuario acha a disputa pelos arquivos (a 1a versao dizia 'nenhuma' com 14)
        run: python testar_conferir_usuario.py
      - name: A lista de modelos diz quando o provedor do config nao respondeu (OpenAI 26/09)
        run: LAUDO_BASE=/tmp/base.sqlite python testar_ia_modelos.py
      - name: Espera da IA proporcional ao laudo e laudo cortado no teto vem marcado
        run: python testar_tempo_nuvem.py
      - name: O roteador diz quando roda codigo velho (versao presa em 26.1 por 5 commits)
        run: LAUDO_BASE=/tmp/base.sqlite python testar_versao.py
      - name: Testar o importador de máscaras e laudos próprios
        run: python testar_importar.py
      - name: Testar o RX literal (achados com as palavras ditadas)
        run: LAUDO_BASE=/tmp/base.sqlite python testar_rx_literal.py
      - name: Testar a fila do Radius (arquivos falsos; nome nunca pode sair)
        run: python testar_radius.py
      - name: Testar a TC com as palavras do médico (alterações primeiro)
        run: LAUDO_BASE=/tmp/base.sqlite python testar_tc_literal.py
      - name: Testar o modo estação e o perfil (arquivos falsos)
        run: LAUDO_BASE=/tmp/base.sqlite python testar_estacao.py
      - name: Testar as rotas da interface v2 (banco, IA e abrir no RadiAnt)
        run: LAUDO_BASE=/tmp/base.sqlite python testar_v2.py
      - name: Nenhum teste escreve na pasta do roteador (a sujeira de 25/09 nao volta)
        run: |
          sujo="$(git status --porcelain --ignored -- . ':(exclude)CATALOGO.txt' ':(exclude)__pycache__')"
          if [ -n "$sujo" ]; then echo "teste escreveu na pasta:"; echo "$sujo"; exit 1; fi
          echo "pasta limpa"
      - name: Modelo de laudo estruturado (rotulo em negrito) e copiar com formatacao
        working-directory: app
        run: bun src/components/rotrix2/formatar.test.ts
      - name: Qual IA cada botao aciona (nenhum botao paga caro por acaso)
        working-directory: app
        run: bun src/components/rotrix2/modelos.test.ts
