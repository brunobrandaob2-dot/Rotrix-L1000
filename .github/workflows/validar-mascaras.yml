name: Validar máscaras

on:
  push:
    paths: ["roteador-atual/**", ".github/workflows/validar-mascaras.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roteador-atual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar o banco
        run: LAUDO_BASE=/tmp/base.sqlite LAUDO_CATALOGO=/tmp/catalogo.txt python construir_base.py
      - name: Validar todas as regiões
        run: |
          regioes=$(find dados/mascaras -name normal.txt -printf '%h\n' | sort)
          python validar_regiao.py $regioes
      - name: Testar a rota de nuvem (sem internet, respostas simuladas)
        run: LAUDO_BASE=/tmp/base.sqlite python testar_nuvem.py
      - name: Testar o importador de máscaras e laudos próprios
        run: python testar_importar.py
      - name: Testar o RX literal (achados com as palavras ditadas)
        run: LAUDO_BASE=/tmp/base.sqlite python testar_rx_literal.py
      - name: Testar a fila do Radius (arquivos falsos; nome nunca pode sair)
        run: python testar_radius.py
      - name: Testar a TC com as palavras do médico (alterações primeiro)
        run: LAUDO_BASE=/tmp/base.sqlite python testar_tc_literal.py
      - name: Testar o modo estação e o perfil (arquivos falsos)
        run: LAUDO_BASE=/tmp/base.sqlite python testar_estacao.py
      - name: Testar as rotas da interface v2 (banco, IA e abrir no RadiAnt)
        run: LAUDO_BASE=/tmp/base.sqlite python testar_v2.py
