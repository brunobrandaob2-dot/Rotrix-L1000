name: Build Windows (Rotrix L-1000)

# Gera o instalador de Windows do Rotrix L-1000 (app/ = fork do Handy, MIT)
# com o Roteador de Laudos embutido (Python embutido + mascaras + banco).
# O instalador fica em Actions -> esta execucao -> Artifacts.

on:
  push:
    # main = versão estável; rotrix-pagina = telas novas em teste (compila à parte)
    branches: [main, rotrix-pagina]
    paths:
      - "app/**"
      - "roteador-atual/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write        # publica a versao "ultima" (Releases) para o app baixar

env:
  PYTHON_EMBED_VERSION: "3.12.10"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Enable long paths
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"
          key: rotrix-windows-v1
          cache-bin: false

      - name: Setup Python (para gerar o banco de mascaras)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Locate VC++ runtime redist (app-local)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -property installationPath
          $redistVersion = (Get-Content (Join-Path $vsRoot "VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt")).Trim()
          $archDir = Join-Path $vsRoot "VC\Redist\MSVC\$redistVersion\x64"
          $crt = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.CRT" | Sort-Object Name | Select-Object -Last 1
          $omp = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.OpenMP" | Sort-Object Name | Select-Object -Last 1
          Add-Content -Path $env:GITHUB_ENV -Value "HANDY_VC_REDIST_DIRS=$($crt.FullName);$($omp.FullName)"

      - name: Install ONNX Runtime (baseline, x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ORT_VERSION = "1.24.2"
          Invoke-WebRequest -Uri "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VERSION/onnxruntime-win-x64-$ORT_VERSION.zip" -OutFile ort.zip
          Expand-Archive -Path ort.zip -DestinationPath ort-dist -Force
          $ortLib = (Resolve-Path "ort-dist/onnxruntime-win-x64-$ORT_VERSION/lib").Path
          Add-Content -Path $env:GITHUB_ENV -Value "ORT_LIB_LOCATION=$ortLib"
          Add-Content -Path $env:GITHUB_ENV -Value "ORT_PREFER_DYNAMIC_LINK=1"

      - name: Install SPIRV-Headers (Vulkan build)
        shell: pwsh
        run: |
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install spirv-headers failed" }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\','/'
          $combined = if ($env:CMAKE_PREFIX_PATH) { "$prefix;$env:CMAKE_PREFIX_PATH" } else { $prefix }
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$combined"

      # ---------- Roteador de Laudos embutido ----------
      - name: Gerar o banco de mascaras
        working-directory: roteador-atual
        run: python construir_base.py

      - name: Montar o pacote do roteador (Python embutido + roteador + colador)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dst = "app/src-tauri/resources/rotrix"
          New-Item -ItemType Directory -Force "$dst/python","$dst/roteador" | Out-Null
          # Python embutido oficial (python.org), sem instalacao
          $v = $env:PYTHON_EMBED_VERSION
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/$v/python-$v-embed-amd64.zip" -OutFile py.zip
          Expand-Archive py.zip -DestinationPath "$dst/python" -Force
          # roteador: codigo, mascaras, banco, vocabulario (sem segredos)
          $src = "roteador-atual"
          Copy-Item "$src/*.py","$src/config.json","$src/vocabularios.json","$src/base.sqlite","$src/CATALOGO.txt" "$dst/roteador/"
          Copy-Item "$src/dados" "$dst/roteador/dados" -Recurse
          Copy-Item "$src/handy/handy_radiology_map.tsv" "$dst/roteador/handy_radiology_map.tsv"
          Get-ChildItem "$dst/roteador" -Recurse -Directory -Filter "__pycache__" | Remove-Item -Recurse -Force
          # o instalador e distribuido: laudos de estilo e notas internas do
          # Bruno NAO entram (o app recria a pasta vazia no primeiro uso)
          Remove-Item "$dst/roteador/dados/estilo" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$dst/roteador/dados/relatorio_ortografia.txt","$dst/roteador/dados/revisao_clinica_pendente.json" -Force -ErrorAction SilentlyContinue
          "$env:GITHUB_SHA $(Get-Date -Format s)" | Set-Content "$dst/roteador/VERSAO_PACOTE.txt"

      - name: Conferir que nada pessoal entrou no instalador
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dst = "app/src-tauri/resources/rotrix/roteador"
          $proibidos = @()
          if (Test-Path "$dst/dados/estilo") { $proibidos += "dados/estilo (laudos de estilo)" }
          foreach ($n in @("chave_anthropic.txt","gasto.json","aprendizado.json",".radius_sal","radius_estrutura.txt","apagados.json","dados/apagados.json")) {
            if (Test-Path "$dst/$n") { $proibidos += $n }
          }
          # chave de API escrita em qualquer arquivo de texto do pacote
          $padrao = 'sk-[A-Za-z0-9_\-]{20,}|AIza[0-9A-Za-z_\-]{30,}'
          Get-ChildItem "$dst" -Recurse -File -Include *.py,*.json,*.txt,*.md,*.tsv,*.ps1 | ForEach-Object {
            $achou = Select-String -Path $_.FullName -Pattern $padrao -AllMatches -ErrorAction SilentlyContinue |
              Where-Object { $_.Matches.Value -notmatch 'SEGREDO|EXEMPLO|TESTE|FAKE|XXXX' }
            if ($achou) { $proibidos += "chave em $($_.FullName)" }
          }
          if ($proibidos.Count -gt 0) {
            Write-Host "::error::arquivo pessoal no instalador: $($proibidos -join ', ')"
            exit 1
          }
          Write-Host "[ok] instalador sem nada pessoal dentro"

      - name: Compilar o colador com negrito (texto rico)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "app/src-tauri/resources/rotrix/roteador/colador.exe"
          Add-Type -Path "roteador-atual/handy/handy_radiology_paste.cs" `
            -ReferencedAssemblies @("System.dll","System.Core.dll","System.Windows.Forms.dll") `
            -OutputAssembly $out -OutputType WindowsApplication
          if (-not (Test-Path $out)) { throw "colador nao foi gerado" }

      - name: Testar o roteador no Python embutido
        shell: pwsh
        working-directory: app/src-tauri/resources/rotrix/roteador
        run: |
          ..\python\python.exe -c "import sys,os; sys.path.insert(0,os.getcwd()); import roteador as r; print(r.rotear('rx de joelho direito com artrose medial')[1]); print(r.rotear('tc de torax normal')[1])"
          if ($LASTEXITCODE -ne 0) { throw "roteador falhou no Python embutido" }

      - name: Testar a base e o importador no Python embutido
        shell: pwsh
        working-directory: app/src-tauri/resources/rotrix/roteador
        run: |
          # o Python embutido nao poe a pasta do script no caminho (._pth): o importador
          # de mascaras do usuario precisa ser achado mesmo assim
          $saida = ..\python\python.exe construir_base.py 2>&1 | Out-String
          Write-Host $saida
          if ($LASTEXITCODE -ne 0) { throw "construir_base falhou no Python embutido" }
          if ($saida -match "importar_usuario indispon") { throw "construir_base nao achou o importador no Python embutido" }
          ..\python\python.exe importar_usuario.py listar --json
          if ($LASTEXITCODE -ne 0) { throw "importador falhou no Python embutido" }
          ..\python\python.exe testar_rx_literal.py
          if ($LASTEXITCODE -ne 0) { throw "RX literal falhou no Python embutido" }
          ..\python\python.exe testar_radius.py
          if ($LASTEXITCODE -ne 0) { throw "fila do Radius falhou no Python embutido" }
          ..\python\python.exe testar_tc_literal.py
          if ($LASTEXITCODE -ne 0) { throw "TC com as palavras do medico falhou no Python embutido" }
          ..\python\python.exe testar_estacao.py
          if ($LASTEXITCODE -ne 0) { throw "modo estacao/perfil falhou no Python embutido" }
          Get-ChildItem -Recurse -Directory -Filter "__pycache__" | Remove-Item -Recurse -Force

      # ---------- App ----------
      - name: Install frontend dependencies
        working-directory: app
        run: bun install

      - name: Build with Tauri (NSIS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # o app usa isso para saber se ja esta na versao publicada
          ROTRIX_COMMIT: ${{ github.sha }}
          ROTRIX_DATA: ${{ github.run_id }}
        with:
          projectPath: app
          tauriScript: bun run tauri
          args: --bundles nsis

      # "ultima": o app procura aqui e baixa sem precisar de login no GitHub
      - name: Publicar a versao "ultima" (so na main)
        if: github.ref_name == 'main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem "app/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $exe) { throw "instalador nao encontrado" }
          $curto = "${{ github.sha }}".Substring(0,7)
          $nome = "Rotrix-L1000-$curto.exe"
          Copy-Item $exe.FullName $nome
          $notas = "Instalador do Rotrix L-1000.`n`nCommit: ${{ github.sha }}`nGerado em: $(Get-Date -Format 'yyyy-MM-dd HH:mm') UTC"
          gh release delete ultima --yes --cleanup-tag 2>$null
          gh release create ultima $nome --title "Rotrix L-1000 ($curto)" --notes "$notas" --target ${{ github.sha }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Rotrix-L1000-instalador-windows-${{ github.ref_name }}
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
